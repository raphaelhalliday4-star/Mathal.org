<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore a Mathal analytics case study and view its full project report." />
    <title>Project Case Study | Mathal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="project-view-page">
    <div class="page-shell">
      <header class="site-header">
        <div class="container header-wrap">
          <a href="index.html" class="brand" aria-label="Mathal homepage">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="brand-text">Mathal</span>
          </a>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html#home">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#case-studies" class="active">Case Studies</a>
            <a href="index.html#about">About</a>
          </nav>
          <a href="contact.html" class="button button-primary nav-cta">Get in Touch</a>
          <button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <main class="project-main">
        <div class="container">
          <a class="project-back" href="index.html#case-studies"><span aria-hidden="true">←</span> All case studies</a>
          <section class="project-intro" aria-labelledby="project-title">
            <p class="eyebrow" id="project-category">MATHAL CASE STUDY</p>
            <h1 id="project-title">Project report</h1>
            <p class="project-summary" id="project-summary">Loading project details...</p>
            <div class="project-metrics" id="project-metrics" aria-label="Project highlights"></div>
            <a id="project-read-button" class="button button-primary" href="#" target="_blank" rel="noopener">Read report</a>
          </section>

          <section class="project-report" aria-label="Full project report">
            <div class="report-toolbar">
              <div>
                <p class="eyebrow">FULL REPORT</p>
                <h2 id="report-title">Project report</h2>
              </div>
              <span class="report-view-only">View only</span>
            </div>
            <div class="report-status" id="report-status" aria-live="polite">Loading report pages…</div>
            <div class="report-reader" id="report-reader" aria-live="polite"></div>
          </section>

          <section class="project-files" aria-labelledby="project-files-title">
            <div class="project-files-heading">
              <p class="eyebrow">PROJECT FILES</p>
              <h2 id="project-files-title">Explore the supporting files</h2>
            </div>
            <div class="project-file-list" id="project-file-list"></div>
          </section>
        </div>
      </main>

      <footer class="project-footer">
        <div class="container project-footer-inner">
          <a href="index.html#case-studies">← Back to case studies</a>
          <a href="contact.html" class="button button-primary">Discuss a project</a>
        </div>
      </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/project.js"></script>
  </body>
</html>
